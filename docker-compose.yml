name: claimflow

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD:?Set SQLSERVER_SA_PASSWORD in .env}
      MSSQL_PID: Developer
    ports:
      - "${SQLSERVER_HOST_PORT:-1433}:1433"
    volumes:
      - claimflow-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-claimflow}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}
    ports:
      - "${RABBITMQ_HOST_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672"
    volumes:
      - claimflow-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  migrator:
    build:
      context: .
      dockerfile: tools/ClaimFlow.Migrator/Dockerfile
    environment:
      ConnectionStrings__ClaimFlow: Server=sqlserver,1433;Database=ClaimFlow;User Id=sa;Password=${SQLSERVER_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False
      DB_SCRIPTS_PATH: /app/db
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  intake:
    build:
      context: .
      dockerfile: src/ClaimFlow.Intake/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Database__Provider: SqlServer
      ConnectionStrings__ClaimFlow: Server=sqlserver,1433;Database=ClaimFlow;User Id=sa;Password=${SQLSERVER_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False
      Messaging__Provider: RabbitMq
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: ${RABBITMQ_DEFAULT_USER:-claimflow}
      RabbitMq__Password: ${RABBITMQ_DEFAULT_PASS}
      RabbitMq__ConsumerConcurrency: 4
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      Jwt__Issuer: claimflow
      Jwt__Audience: claimflow-api
      Serilog__Console: "true"
      Outbox__PollIntervalMs: 100
    ports:
      - "${INTAKE_HOST_PORT:-5080}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped

  adjudication:
    build:
      context: .
      dockerfile: src/ClaimFlow.Adjudication/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Database__Provider: SqlServer
      ConnectionStrings__ClaimFlow: Server=sqlserver,1433;Database=ClaimFlow;User Id=sa;Password=${SQLSERVER_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False
      Messaging__Provider: RabbitMq
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: ${RABBITMQ_DEFAULT_USER:-claimflow}
      RabbitMq__Password: ${RABBITMQ_DEFAULT_PASS}
      RabbitMq__ConsumerConcurrency: 4
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      Jwt__Issuer: claimflow
      Jwt__Audience: claimflow-api
      Intake__BaseUrl: http://intake:8080
      Serilog__Console: "true"
    ports:
      - "${ADJUDICATION_HOST_PORT:-5081}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      intake:
        condition: service_healthy
    restart: unless-stopped

volumes:
  claimflow-sql-data:
  claimflow-rabbitmq-data:
