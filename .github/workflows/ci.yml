name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  build-test:
    name: Build, test, coverage
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci${{ github.run_id }}!Passw0rd"
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Ci${{ github.run_id }}!Passw0rd' -C -Q 'SELECT 1' -b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 30s
    env:
      CLAIMFLOW_SQLSERVER_CONNECTION: "Server=localhost,1433;Database=ClaimFlowCi;User Id=sa;Password=Ci${{ github.run_id }}!Passw0rd;TrustServerCertificate=True;Encrypt=False"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build (warnings as errors)
        run: dotnet build --configuration Release --no-restore -warnaserror

      - name: Test with coverage
        run: >
          dotnet test --configuration Release --no-build
          --collect:"XPlat Code Coverage"
          --results-directory TestResults
          --logger "trx"

      - name: Coverage summary
        if: always()
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          export PATH="$PATH:$HOME/.dotnet/tools"
          reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:"coverage" -reporttypes:"TextSummary;Html"
          {
            echo "## Coverage summary"
            echo '```'
            cat coverage/Summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults/
            coverage/
          retention-days: 14

  sql-lint:
    name: Lint db/*.sql against SQL Server
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci${{ github.run_id }}!Passw0rd"
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Ci${{ github.run_id }}!Passw0rd' -C -Q 'SELECT 1' -b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 30s
    env:
      SQL_CONNECTION: "Server=localhost,1433;Database=ClaimFlowLint;User Id=sa;Password=Ci${{ github.run_id }}!Passw0rd;TrustServerCertificate=True;Encrypt=False"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore and build migrator
        run: |
          dotnet restore
          dotnet build tools/ClaimFlow.Migrator/ClaimFlow.Migrator.csproj --configuration Release --no-restore

      - name: Execute migrations and every db/*.sql script
        run: >
          dotnet run --project tools/ClaimFlow.Migrator --configuration Release --no-build --
          --connection "$SQL_CONNECTION"


  docker-build:
    name: Build container images
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - name: Build intake image
        run: docker build -f src/ClaimFlow.Intake/Dockerfile -t claimflow-intake:ci .

      - name: Build adjudication image
        run: docker build -f src/ClaimFlow.Adjudication/Dockerfile -t claimflow-adjudication:ci .

      - name: Build migrator image
        run: docker build -f tools/ClaimFlow.Migrator/Dockerfile -t claimflow-migrator:ci .

      - name: Validate compose file
        run: |
          cp .env.example .env
          sed -i 's/__SET_A_STRONG_LOCAL_PASSWORD__/Ci${{ github.run_id }}!Passw0rd/g' .env
          sed -i 's/__SET_AT_LEAST_32_CHARACTERS__/ci-only-signing-key-0123456789abcdef/g' .env
          docker compose config > /dev/null
